<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harry Potter x Blood on the Clocktower</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #c5c6c7; }
    h1, h2, h3, .magic-font { font-family: 'Cinzel', serif; }
    .gold-border { border-color: #d4af37; }
    .gold-text { color: #d4af37; }
    .gold-bg { background-color: #d4af37; }
  </style>
  <script>
    const SUPABASE_URL = "https://tnvftxeohsxwazsnwfip.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_to3lCwqIAYz3vQgq0gVK-w_Y4nLAbTN"; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const defaultUsers = [
      { id: 'divak-id', username: 'divak', name: 'Divák zvenčí', role: 'SPECTATOR', house: 'None', points: 0, stream: '' }
    ];

    const defaultHousePoints = { Gryffindor: 0, Slytherin: 0, Ravenclaw: 0, Hufflepuff: 0 };

    let currentUser = null;
    let users = defaultUsers;
    let characters = [];
    let items = [];
    let games = [];
    let polls = [];
    let housePoints = defaultHousePoints;
    let houseUpgrades = { Gryffindor: [], Slytherin: [], Ravenclaw: [], Hufflepuff: [] };
    let maxHousePoints = 100;
    let activeTab = 'characters';

    let tempGamePlayers = [];
    let tempGameCharacters = [];

    let editingGameId = null;
    let editingPollId = null;
    let editingUserId = null;
    let targetUpgradeHouse = null;
    let editingUpgradeId = null;
    let editingItemId = null;

    async function loadStateFromCloud() {
      try {
        const { data, error } = await supabaseClient
          .from('app_data')
          .select('payload')
          .eq('id', 1)
          .single();

        if (error) {
          console.error('Chyba při načítání ze Supabase:', error);
          return;
        }

        if (data && data.payload) {
          const p = data.payload;
          users = p.users && p.users.length > 0 ? p.users : defaultUsers;
          users.forEach(u => { 
            if (u.points === undefined) u.points = 0; 
            if (u.stream === undefined) u.stream = '';
          });

          games = p.games || [];
          polls = p.polls || [];
          housePoints = p.housePoints || defaultHousePoints;
          if (p.maxHousePoints !== undefined) maxHousePoints = p.maxHousePoints;

          const rawCharacters = p.characters || [];
          const rawItems = p.items || [];
          const rawUpgrades = p.houseUpgrades || { Gryffindor: [], Slytherin: [], Ravenclaw: [], Hufflepuff: [] };

          const isAdmin = currentUser && currentUser.role === 'ADMIN';

          if (isAdmin) {
            characters = rawCharacters.map(c => ({
              ...c,
              onScript: c.onScript !== undefined ? c.onScript : true,
              visible: c.visible !== undefined ? c.visible : true
            }));
            items = rawItems;
            houseUpgrades = rawUpgrades;
          } else {
            characters = rawCharacters
              .filter(c => c.visible !== false)
              .map(c => ({ ...c, onScript: c.onScript !== undefined ? c.onScript : true, visible: true }));

            items = rawItems.filter(i => i.visible !== false);

            houseUpgrades = {
              Gryffindor: (rawUpgrades.Gryffindor || []).filter(u => u.visible !== false),
              Slytherin: (rawUpgrades.Slytherin || []).filter(u => u.visible !== false),
              Ravenclaw: (rawUpgrades.Ravenclaw || []).filter(u => u.visible !== false),
              Hufflepuff: (rawUpgrades.Hufflepuff || []).filter(u => u.visible !== false)
            };
          }
        }
      } catch (err) {
        console.error('Chyba připojení k databázi:', err);
      }
    }

    async function saveState() {
      const payloadData = { users, characters, items, games, polls, housePoints, houseUpgrades, maxHousePoints };
      try {
        const { error } = await supabaseClient
          .from('app_data')
          .upsert({ id: 1, payload: payloadData });

        if (error) {
          console.error('Chyba při ukládání do Supabase:', error);
        } else {
          console.log('Data úspěšně uložena do cloudu.');
        }
      } catch (err) {
        console.error('Chyba připojení k databázi:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadStateFromCloud();
      renderCurrentTab();
    });

    function fillLogin(u, p) {
      document.getElementById('login-username').value = u;
      document.getElementById('login-password').value = p;
    }

    async function handleLogin(e) {
      if (e) e.preventDefault();
      const inputId = document.getElementById('login-username').value.trim();
      const inputPass = document.getElementById('login-password').value.trim();

      if (inputId.toLowerCase() === 'divak' && inputPass === 'bradavice') {
        currentUser = users.find(u => u.role === 'SPECTATOR') || defaultUsers[0];
        await showAppScreen();
        return;
      }

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: inputId,
        password: inputPass
      });

      if (error) {
        alert('Neplatné přihlašovací údaje nebo chyba: ' + error.message);
        return;
      }

      const authUser = data.user;

      let found = users.find(u => 
        (u.email && u.email.toLowerCase() === inputId.toLowerCase()) || 
        (u.id === authUser.id)
      );

      if (!found && (inputId.toLowerCase() === 'mragnl@bradavice.sts' || inputId.toLowerCase() === 'minecraftpetr2001@gmail.com')) {
        found = { 
          id: authUser.id, 
          email: inputId,
          username: 'MrAgnl', 
          name: 'MrAgnl', 
          role: 'ADMIN', 
          house: 'Hufflepuff', 
          points: 0, 
          stream: '' 
        };
        users.push(found);
        await saveState();
      }

      if (found) {
        currentUser = found;
        await showAppScreen();
      } else {
        alert('Přihlášení v Auth proběhlo, ale uživatel nemá vytvořený profil v aplikaci. Požádej administrátora o registraci.');
      }
    }

    async function showAppScreen() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('user-display-name').textContent = currentUser.name;
      
      let roleName = 'Hráč';
      if (currentUser.role === 'ADMIN') roleName = 'Učitel (Admin / GM)';
      if (currentUser.role === 'SPECTATOR') roleName = 'Divák';
      document.getElementById('user-display-role').textContent = roleName;

      await loadStateFromCloud();
      renderCurrentTab();
    }

    function logout() {
      supabaseClient.auth.signOut();
      currentUser = null;
      document.getElementById('app-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('border-yellow-500', 'text-yellow-400');
        btn.classList.add('border-transparent', 'text-gray-400');
      });
      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      if (activeBtn) {
        activeBtn.classList.remove('border-transparent', 'text-gray-400');
        activeBtn.classList.add('border-yellow-500', 'text-yellow-400');
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      const activeContent = document.getElementById(`tab-content-${activeTab}`);
      if (activeContent) activeContent.classList.remove('hidden');

      if (activeTab === 'characters') renderCharacters();
      if (activeTab === 'items') renderItems();
      if (activeTab === 'games') renderGames();
      if (activeTab === 'players') renderPlayers();
      if (activeTab === 'leaderboard') renderLeaderboard();
      if (activeTab === 'polls') renderPolls();
    }

    // --- ITEMY ---
    function openItemModal(itemId = null) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      editingItemId = itemId;
      const modalTitle = document.getElementById('item-modal-title');

      if (itemId) {
        modalTitle.textContent = 'Upravit item';
        const item = items.find(i => i.id === itemId);
        if (item) {
          document.getElementById('item-name').value = item.name;
          document.getElementById('item-desc').value = item.desc;
          document.getElementById('item-image-url').value = item.image || '';
          document.getElementById('item-visible').checked = item.visible !== false;
        }
      } else {
        modalTitle.textContent = 'Přidat nový item';
        document.getElementById('add-item-form').reset();
        document.getElementById('item-visible').checked = true;
      }
      document.getElementById('item-modal').classList.remove('hidden');
    }

    function closeItemModal() {
      document.getElementById('item-modal').classList.add('hidden');
      document.getElementById('add-item-form').reset();
      editingItemId = null;
    }

    function handleItemImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('item-image-url').value = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function saveItem(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'ADMIN') return;

      const name = document.getElementById('item-name').value.trim();
      const desc = document.getElementById('item-desc').value.trim();
      const image = document.getElementById('item-image-url').value.trim();
      const visible = document.getElementById('item-visible').checked;

      if (editingItemId) {
        const item = items.find(i => i.id === editingItemId);
        if (item) {
          item.name = name;
          item.desc = desc;
          item.image = image;
          item.visible = visible;
        }
      } else {
        items.unshift({
          id: 'item_' + Date.now(),
          name,
          desc,
          image,
          visible
        });
      }

      await saveState();
      closeItemModal();
      renderItems();
    }

    async function deleteItem(itemId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      if (confirm('Opravdu chcete smazat tento item?')) {
        items = items.filter(i => i.id !== itemId);
        await saveState();
        renderItems();
      }
    }

    function renderItems() {
      const container = document.getElementById('items-container');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';
      const adminBtnArea = document.getElementById('item-admin-btn-area');
      if (adminBtnArea) adminBtnArea.className = isAdmin ? 'mb-6' : 'hidden';

      let displayItems = isAdmin ? items : items.filter(i => i.visible !== false);
      if (displayItems.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-12">Zatím nebyly přidány žádné itemy.</div>`;
        return;
      }

      container.innerHTML = displayItems.map(i => `
        <div class="border ${i.visible === false ? 'border-red-900/40 bg-gray-950/40 opacity-60' : 'border-yellow-600/30 bg-gray-900/60'} rounded-xl p-5 shadow-lg relative flex flex-col justify-between">
          <div>
            ${isAdmin ? `
              <div class="absolute top-4 right-4 flex gap-2 items-center">
                ${i.visible === false ? '<span class="text-[10px] bg-red-950 text-red-400 border border-red-800 px-2 py-0.5 rounded font-semibold">Skryto</span>' : ''}
                <button onclick="openItemModal('${i.id}')" class="text-yellow-400 hover:text-yellow-300 text-sm p-1" title="Upravit"><i class="fa-solid fa-pen"></i></button>
                <button onclick="deleteItem('${i.id}')" class="text-red-400 hover:text-red-300 text-sm p-1" title="Smazat"><i class="fa-solid fa-trash"></i></button>
              </div>
            ` : ''}
            <div class="flex items-center space-x-4 mb-4">
              ${i.image ? `<img src="${i.image}" class="w-16 h-16 object-contain rounded-lg border border-yellow-500/30 bg-black/60 p-1">` : `<div class="w-16 h-16 rounded-lg bg-gray-800 border border-gray-700 flex items-center justify-center text-yellow-500 text-2xl"><i class="fa-solid fa-wand-magic-sparkles"></i></div>`}
              <div>
                <h3 class="font-bold text-lg text-white magic-font">${i.name}</h3>
              </div>
            </div>
            <p class="text-sm text-gray-300 leading-relaxed">${i.desc || 'Bez popisu.'}</p>
          </div>
        </div>
      `).join('');
    }

    // --- ANKETY ---
    function openPollModal(pollId = null) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      
      editingPollId = pollId;
      const modalTitle = document.getElementById('poll-modal-title');
      const container = document.getElementById('poll-options-container');
      container.innerHTML = '';

      if (pollId) {
        modalTitle.textContent = 'Upravit anketu';
        const poll = polls.find(p => p.id === pollId);
        if (poll) {
          document.getElementById('poll-title-input').value = poll.title;
          document.getElementById('poll-max-votes').value = poll.maxVotes || 1;
          poll.options.forEach(opt => addPollOptionInput(opt.text));
        }
      } else {
        modalTitle.textContent = 'Nová anketa';
        document.getElementById('add-poll-form').reset();
        addPollOptionInput();
        addPollOptionInput();
      }
      document.getElementById('poll-modal').classList.remove('hidden');
    }

    function closePollModal() {
      document.getElementById('poll-modal').classList.add('hidden');
      document.getElementById('add-poll-form').reset();
      editingPollId = null;
    }

    function addPollOptionInput(initialValue = '') {
      const container = document.getElementById('poll-options-container');
      const count = container.children.length;
      if (count >= 10) return alert('Max 10 možností!');
      const div = document.createElement('div');
      div.className = "flex gap-2 items-center";
      div.innerHTML = `
        <input type="text" value="${initialValue}" placeholder="Možnost ${count + 1}" class="poll-option-input flex-grow bg-black border border-gray-700 rounded p-2 text-sm text-white" required>
        ${count >= 2 ? `<button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>` : ''}
      `;
      container.appendChild(div);
    }

    async function savePoll(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const title = document.getElementById('poll-title-input').value.trim();
      const maxVotes = parseInt(document.getElementById('poll-max-votes').value) || 1;
      const optionInputs = document.querySelectorAll('.poll-option-input');
      
      const newOptionsText = [];
      optionInputs.forEach(input => {
        const val = input.value.trim();
        if (val) newOptionsText.push(val);
      });

      if (newOptionsText.length < 2) return alert('Anketa musí mít alespoň 2 možnosti!');

      if (editingPollId) {
        const poll = polls.find(p => p.id === editingPollId);
        if (poll) {
          poll.title = title;
          poll.maxVotes = maxVotes;
          poll.options = newOptionsText.map(text => {
            const existingOpt = poll.options.find(o => o.text === text);
            return { text: text, votes: existingOpt ? existingOpt.votes : [] };
          });
        }
      } else {
        polls.unshift({
          id: Date.now(),
          title,
          maxVotes,
          closed: false,
          options: newOptionsText.map(t => ({ text: t, votes: [] }))
        });
      }

      await saveState();
      closePollModal();
      renderPolls();
    }

    async function togglePollClose(pollId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const poll = polls.find(p => p.id === pollId);
      if (poll) {
        poll.closed = !poll.closed;
        await saveState();
        renderPolls();
      }
    }

    async function deletePoll(pollId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      if (confirm('Opravdu chcete smazat tuto anketu?')) {
        polls = polls.filter(p => p.id !== pollId);
        await saveState();
        renderPolls();
      }
    }

    async function votePoll(pollId, optionIndex) {
      if (!currentUser || currentUser.role === 'SPECTATOR') return alert('Diváci nemohou hlasovat.');
      const poll = polls.find(p => p.id === pollId);
      if (!poll || poll.closed) return;

      const userVotesCount = poll.options.filter(opt => opt.votes.includes(currentUser.id)).length;
      const hasVotedThis = poll.options[optionIndex].votes.includes(currentUser.id);

      if (hasVotedThis) {
        poll.options[optionIndex].votes = poll.options[optionIndex].votes.filter(id => id !== currentUser.id);
      } else {
        if (userVotesCount >= poll.maxVotes) return alert(`Maximálně ${poll.maxVotes} hlasů!`);
        poll.options[optionIndex].votes.push(currentUser.id);
      }

      await saveState();
      renderPolls();
    }

    function renderPolls() {
      const container = document.getElementById('polls-list');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';
      document.getElementById('poll-admin-btn-area').className = isAdmin ? 'mb-6' : 'hidden';

      if (polls.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 py-8">Zatím nebyly vytvořeny žádné ankety.</div>`;
        return;
      }

      container.innerHTML = polls.map(p => {
        let maxVotesCount = 0;
        if (p.closed && p.options) {
          maxVotesCount = Math.max(...p.options.map(o => o.votes ? o.votes.length : 0));
        }
        return `
          <div class="bg-gray-900 border ${p.closed ? 'border-red-900/40 bg-gray-950/80' : 'border-yellow-600/30'} p-5 rounded-xl mb-4 shadow-lg relative">
            ${isAdmin ? `
              <div class="absolute top-4 right-4 flex gap-2">
                <button onclick="openPollModal(${p.id})" class="text-yellow-400 hover:text-yellow-300 text-sm p-1" title="Upravit"><i class="fa-solid fa-pen"></i></button>
                <button onclick="togglePollClose(${p.id})" class="text-xs px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700">${p.closed ? 'Otevřít' : 'Uzavřít'}</button>
                <button onclick="deletePoll(${p.id})" class="text-red-400 hover:text-red-300 text-sm p-1" title="Smazat"><i class="fa-solid fa-trash"></i></button>
              </div>
            ` : ''}
            <h3 class="text-lg font-bold text-white magic-font mb-2">${p.title} ${p.closed ? '<span class="text-xs bg-red-950 text-red-400 border border-red-700 px-2 py-0.5 rounded">UZAVŘENO</span>' : ''}</h3>
            <div class="space-y-2 mt-4">
              ${p.options.map((opt, idx) => {
                const hasVoted = currentUser && opt.votes.includes(currentUser.id);
                const isWinner = p.closed && maxVotesCount > 0 && opt.votes.length === maxVotesCount;
                return `
                  <button onclick="votePoll(${p.id}, ${idx})" ${p.closed ? 'disabled' : ''} class="w-full text-left p-3 rounded-lg border ${hasVoted ? 'border-yellow-500 bg-yellow-500/20 text-yellow-300' : 'border-gray-800 bg-black/40 text-gray-300'} transition flex justify-between items-center">
                    <span class="text-sm font-semibold">${opt.text}</span>
                    <span class="text-xs px-2.5 py-1 rounded-full font-bold ${isWinner ? 'bg-green-600 text-white' : 'bg-gray-800 text-gray-400'}">${opt.votes.length} hlasů ${isWinner ? '★' : ''}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // --- HISTORIE HER ---
    function openGameModal(gameId = null) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      editingGameId = gameId;
      const modalTitle = document.getElementById('game-modal-title');
      if (gameId) {
        modalTitle.textContent = 'Upravit hru';
        const game = games.find(g => g.id === gameId);
        if (game) {
          document.getElementById('game-title-input').value = game.title;
          document.getElementById('game-winner-input').value = game.winningTeam;
          tempGameCharacters = [...characters];
          tempGamePlayers = game.players ? game.players.map(p => {
            const userObj = users.find(u => u.name === p.studentName);
            return { userId: userObj ? userObj.id : '', charName: p.charName, startAlignment: p.startAlignment || 'GOOD', endAlignment: p.endAlignment || 'GOOD' };
          }) : [];
        }
      } else {
        modalTitle.textContent = 'Zapsat novou hru';
        document.getElementById('add-game-form').reset();
        tempGamePlayers = [];
        tempGameCharacters = [...characters];
      }
      document.getElementById('game-modal').classList.remove('hidden');
      renderModalPlayersRows();
    }

    function closeGameModal() {
      document.getElementById('game-modal').classList.add('hidden');
      document.getElementById('add-game-form').reset();
      editingGameId = null;
    }

    function handleGameScriptUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const json = JSON.parse(evt.target.result);
          if (Array.isArray(json)) {
            tempGameCharacters = json.filter(item => item && item.name && item.team && item.team !== 'meta').map(item => ({ name: item.name, team: item.team || 'townsfolk' }));
            renderModalPlayersRows();
            alert(`Scénář nahrán (${tempGameCharacters.length} postav).`);
          }
        } catch (err) { alert('Chyba JSON.'); }
      };
      reader.readAsText(file);
    }

    function addGamePlayerRow() {
      if (tempGamePlayers.length >= 20) return;
      tempGamePlayers.push({ userId: '', charName: '', startAlignment: 'GOOD', endAlignment: 'GOOD' });
      renderModalPlayersRows();
    }

    function removeGamePlayerRow(index) {
      tempGamePlayers.splice(index, 1);
      renderModalPlayersRows();
    }

    function renderModalPlayersRows() {
      const container = document.getElementById('modal-game-players-container');
      const registeredPlayers = users.filter(u => u.role === 'PLAYER');
      const availableChars = tempGameCharacters.length > 0 ? tempGameCharacters : characters;

      container.innerHTML = tempGamePlayers.map((p, idx) => `
        <div class="grid grid-cols-1 md:grid-cols-5 gap-2 bg-black/50 p-3 rounded-lg border border-gray-800 items-center mb-2 text-xs">
          <div>
            <select onchange="tempGamePlayers[${idx}].userId = this.value" class="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white" required>
              <option value="">-- Student --</option>
              ${registeredPlayers.map(u => `<option value="${u.id}" ${p.userId == u.id ? 'selected' : ''}>${u.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <select onchange="tempGamePlayers[${idx}].charName = this.value" class="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white" required>
              <option value="">-- Postava --</option>
              ${availableChars.map(c => `<option value="${c.name}" ${p.charName === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <select onchange="tempGamePlayers[${idx}].startAlignment = this.value" class="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white">
              <option value="GOOD" ${p.startAlignment === 'GOOD' ? 'selected' : ''}>Dobro</option>
              <option value="EVIL" ${p.startAlignment === 'EVIL' ? 'selected' : ''}>Zlo</option>
            </select>
          </div>
          <div>
            <select onchange="tempGamePlayers[${idx}].endAlignment = this.value" class="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white">
              <option value="GOOD" ${p.endAlignment === 'GOOD' ? 'selected' : ''}>Dobro</option>
              <option value="EVIL" ${p.endAlignment === 'EVIL' ? 'selected' : ''}>Zlo</option>
            </select>
          </div>
          <div class="flex justify-end">
            <button type="button" onclick="removeGamePlayerRow(${idx})" class="text-red-400 p-1"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    async function saveGame(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const title = document.getElementById('game-title-input').value.trim();
      const winningTeam = document.getElementById('game-winner-input').value;
      const date = new Date().toLocaleDateString('cs-CZ');

      const evaluatedPlayers = tempGamePlayers.map(p => {
        const studentObj = users.find(u => u.id == p.userId);
        return {
          studentName: studentObj ? studentObj.name : 'Neznámý',
          charName: p.charName || 'Nespecifikováno',
          startAlignment: p.startAlignment,
          endAlignment: p.endAlignment,
          won: p.endAlignment === winningTeam
        };
      });

      if (editingGameId) {
        const game = games.find(g => g.id === editingGameId);
        if (game) { game.title = title; game.winningTeam = winningTeam; game.players = evaluatedPlayers; }
      } else {
        games.unshift({ id: Date.now(), title, winningTeam, date, players: evaluatedPlayers });
      }

      await saveState();
      closeGameModal();
      renderGames();
    }

    async function deleteGame(gameId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      if (confirm('Smazat hru?')) {
        games = games.filter(g => g.id !== gameId);
        await saveState();
        renderGames();
      }
    }

    function renderGames() {
      const container = document.getElementById('games-list');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';
      document.getElementById('game-admin-btn-area').className = isAdmin ? 'mb-6' : 'hidden';

      if (games.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 py-8">Zatím žádné hry.</div>`;
        return;
      }

      container.innerHTML = games.map(g => `
        <div class="bg-gray-900 border ${g.winningTeam === 'GOOD' ? 'border-blue-600/50' : 'border-red-600/50'} p-5 rounded-xl mb-4 shadow-lg relative">
          ${isAdmin ? `
            <div class="absolute top-4 right-4 flex gap-2">
              <button onclick="openGameModal(${g.id})" class="text-yellow-400 text-sm p-1"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteGame(${g.id})" class="text-red-400 text-sm p-1"><i class="fa-solid fa-trash"></i></button>
            </div>
          ` : ''}
          <h3 class="text-lg font-bold text-white magic-font mb-2">${g.title} (${g.winningTeam === 'GOOD' ? 'Dobro' : 'Zlo'})</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs">
            ${(g.players || []).map(p => `
              <div class="p-2 rounded border ${p.won ? 'bg-green-950/20 border-green-800/50 text-green-300' : 'bg-red-950/20 border-red-800/50 text-red-300'} flex justify-between">
                <div><strong>${p.studentName}</strong> (${p.charName})</div>
                <span>${p.won ? 'VÝHRA' : 'PROHRA'}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // --- BODOVÁNÍ KOLEJÍ & VYLEPŠENÍ ---
    async function updateHousePoints(house, delta) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      if (!housePoints[house]) housePoints[house] = 0;
      housePoints[house] += delta;
      await saveState();
      renderLeaderboard();
    }

    async function setHousePointsDirect(house) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const inputVal = prompt(`Zadejte nový celkový počet bodů pro kolej ${house}:`, housePoints[house] || 0);
      if (inputVal === null) return;
      const newPoints = parseInt(inputVal);
      if (isNaN(newPoints)) return alert('Neplatné číslo!');
      housePoints[house] = newPoints;
      await saveState();
      renderLeaderboard();
    }

    async function updateMaxHousePoints() {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const val = parseInt(document.getElementById('max-points-input').value);
      if (isNaN(val) || val <= 0) return alert('Zadejte platné číslo větší než 0!');
      maxHousePoints = val;
      await saveState();
      renderLeaderboard();
      alert('Max bodů uloženo.');
    }

    function openUpgradeModal(house, upgradeId = null) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      targetUpgradeHouse = house;
      editingUpgradeId = upgradeId;

      const modalTitle = document.getElementById('upgrade-modal-title');
      if (upgradeId) {
        modalTitle.textContent = 'Upravit vylepšení';
        const upgrade = (houseUpgrades[house] || []).find(u => u.id === upgradeId);
        if (upgrade) {
          document.getElementById('upgrade-title').value = upgrade.title;
          document.getElementById('upgrade-desc').value = upgrade.desc;
          document.getElementById('upgrade-visible').checked = upgrade.visible !== false;
        }
      } else {
        modalTitle.textContent = 'Nové vylepšení pro kolej';
        document.getElementById('add-upgrade-form').reset();
        document.getElementById('upgrade-visible').checked = true;
      }
      document.getElementById('upgrade-modal').classList.remove('hidden');
    }

    function closeUpgradeModal() {
      document.getElementById('upgrade-modal').classList.add('hidden');
      document.getElementById('add-upgrade-form').reset();
      targetUpgradeHouse = null;
      editingUpgradeId = null;
    }

    async function saveUpgrade(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'ADMIN' || !targetUpgradeHouse) return;

      const title = document.getElementById('upgrade-title').value.trim();
      const desc = document.getElementById('upgrade-desc').value.trim();
      const visible = document.getElementById('upgrade-visible').checked;

      if (!houseUpgrades[targetUpgradeHouse]) houseUpgrades[targetUpgradeHouse] = [];

      if (editingUpgradeId) {
        const upgrade = houseUpgrades[targetUpgradeHouse].find(u => u.id === editingUpgradeId);
        if (upgrade) {
          upgrade.title = title;
          upgrade.desc = desc;
          upgrade.visible = visible;
        }
      } else {
        houseUpgrades[targetUpgradeHouse].unshift({
          id: 'upg_' + Date.now(),
          title,
          desc,
          visible
        });
      }

      await saveState();
      closeUpgradeModal();
      renderLeaderboard();
    }

    async function deleteUpgrade(house, upgradeId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      if (confirm('Smazat toto vylepšení?')) {
        houseUpgrades[house] = houseUpgrades[house].filter(u => u.id !== upgradeId);
        await saveState();
        renderLeaderboard();
      }
    }

    function renderLeaderboard() {
      const container = document.getElementById('house-points-container');
      const adminConfigArea = document.getElementById('admin-max-points-area');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';

      if (adminConfigArea) {
        adminConfigArea.className = isAdmin ? 'mb-6 p-4 bg-gray-900 border border-yellow-600/40 rounded-xl flex items-center gap-4' : 'hidden';
        document.getElementById('max-points-input').value = maxHousePoints;
      }

      const housesMeta = {
        Gryffindor: { name: 'Nebelvír', borderColor: 'border-red-700', textColor: 'text-red-400', rgb: '127, 29, 29', icon: 'fa-shield-halved' },
        Slytherin: { name: 'Zmijozel', borderColor: 'border-green-700', textColor: 'text-green-400', rgb: '20, 83, 45', icon: 'fa-staff-snake' },
        Ravenclaw: { name: 'Havraspár', borderColor: 'border-blue-700', textColor: 'text-blue-400', rgb: '30, 58, 138', icon: 'fa-feather' },
        Hufflepuff: { name: 'Mrzimor', borderColor: 'border-yellow-700', textColor: 'text-yellow-400', rgb: '113, 63, 18', icon: 'fa-sun' }
      };

      container.innerHTML = Object.keys(housesMeta).map(key => {
        const meta = housesMeta[key];
        const points = housePoints[key] || 0;
        
        let percent = maxHousePoints > 0 ? (points / maxHousePoints) * 100 : 0;
        if (percent < 0) percent = 0;
        if (percent > 100) percent = 100;

        const bgStyle = `background: linear-gradient(to top, rgba(${meta.rgb}, 0.65) ${percent}%, #0b0c10 ${percent}%);`;

        const allUpgrades = houseUpgrades[key] || [];
        const visibleUpgrades = isAdmin ? allUpgrades : allUpgrades.filter(u => u.visible !== false);

        return `
          <div class="flex flex-col gap-4">
            <div class="border ${meta.borderColor} rounded-2xl p-6 flex flex-col justify-between shadow-xl relative overflow-hidden" style="${bgStyle}">
              <div>
                <div class="flex items-center justify-between mb-4">
                  <h3 class="text-2xl font-bold magic-font ${meta.textColor}">${meta.name}</h3>
                  <div class="flex items-center gap-2">
                    ${isAdmin ? `<button onclick="openUpgradeModal('${key}')" class="w-8 h-8 rounded-full bg-black/60 border ${meta.borderColor} ${meta.textColor} flex items-center justify-center hover:bg-black transition" title="Přidat vylepšení"><i class="fa-solid fa-plus text-xs"></i></button>` : ''}
                    <i class="fa-solid ${meta.icon} text-2xl ${meta.textColor}"></i>
                  </div>
                </div>
                <div class="text-4xl font-extrabold text-white mb-2 magic-font flex items-baseline gap-2">
                  ${points} <span class="text-sm text-gray-400">bodů</span>
                </div>
                ${isAdmin ? `<button onclick="setHousePointsDirect('${key}')" class="text-xs text-yellow-400 hover:underline mb-4 inline-block"><i class="fa-solid fa-pen"></i> Přepsat ručně</button>` : '<div class="mb-4"></div>'}
              </div>
              ${isAdmin ? `
                <div class="border-t border-gray-800/80 pt-4 grid grid-cols-4 gap-2 text-xs font-bold bg-black/40 p-2 rounded-lg">
                  <button onclick="updateHousePoints('${key}', -10)" class="bg-gray-800 hover:bg-red-900 text-red-400 py-2 rounded">-10</button>
                  <button onclick="updateHousePoints('${key}', -50)" class="bg-gray-800 hover:bg-red-900 text-red-400 py-2 rounded">-50</button>
                  <button onclick="updateHousePoints('${key}', 10)" class="bg-gray-800 hover:bg-green-900 text-green-400 py-2 rounded">+10</button>
                  <button onclick="updateHousePoints('${key}', 50)" class="bg-gray-800 hover:bg-green-900 text-green-400 py-2 rounded">+50</button>
                </div>
              ` : ''}
            </div>

            <div class="space-y-3">
              ${visibleUpgrades.map(u => `
                <div class="border ${meta.borderColor} bg-black/50 rounded-xl p-4 shadow-md relative ${u.visible === false ? 'opacity-60 border-dashed' : ''}">
                  ${isAdmin ? `
                    <div class="absolute top-3 right-3 flex gap-2">
                      ${u.visible === false ? '<span class="text-[10px] bg-red-950 text-red-400 border border-red-800 px-1.5 py-0.5 rounded">Skryto</span>' : ''}
                      <button onclick="openUpgradeModal('${key}', '${u.id}')" class="text-yellow-400 hover:text-yellow-300 text-xs"><i class="fa-solid fa-pen"></i></button>
                      <button onclick="deleteUpgrade('${key}', '${u.id}')" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>
                  ` : ''}
                  <h4 class="font-bold text-sm ${meta.textColor} magic-font mb-1">${u.title}</h4>
                  <p class="text-xs text-gray-300 leading-relaxed">${u.desc}</p>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // --- STUDENTI / UČITELÉ ---
    async function addStudent(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const name = document.getElementById('student-name').value.trim();
      const email = document.getElementById('student-email').value.trim();
      const role = document.getElementById('student-role').value;
      const house = document.getElementById('student-house').value;
      const stream = document.getElementById('student-stream').value.trim();

      if (users.some(u => u.email && u.email.toLowerCase() === email.toLowerCase())) {
        return alert('Uživatel s tímto e-mailem již v seznamu existuje!');
      }

      users.push({ 
        id: 'user_' + Date.now(), 
        email, 
        name, 
        role, 
        house, 
        points: 0,
        stream 
      });
      await saveState();
      document.getElementById('add-student-form').reset();
      renderPlayers();
    }

    function openEditUserModal(userId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      editingUserId = userId;
      const user = users.find(u => u.id === userId);
      if (user) {
        document.getElementById('edit-user-name').value = user.name;
        document.getElementById('edit-user-stream').value = user.stream || '';
        document.getElementById('edit-user-points').value = user.points !== undefined ? user.points : 0;
        document.getElementById('edit-user-modal').classList.remove('hidden');
      }
    }

    function closeEditUserModal() {
      document.getElementById('edit-user-modal').classList.add('hidden');
      editingUserId = null;
    }

    async function saveEditedUser(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'ADMIN' || !editingUserId) return;
      const user = users.find(u => u.id === editingUserId);
      if (user) {
        user.name = document.getElementById('edit-user-name').value.trim();
        user.stream = document.getElementById('edit-user-stream').value.trim();
        user.points = parseInt(document.getElementById('edit-user-points').value) || 0;
        await saveState();
        closeEditUserModal();
        renderPlayers();
      }
    }

    async function updateStudentPoints(userId, delta) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const student = users.find(u => u.id === userId);
      if (student) {
        if (student.points === undefined) student.points = 0;
        student.points += delta;
        await saveState();
        renderPlayers();
      }
    }

    async function deleteStudent(userId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      if (confirm('Opravdu chcete smazat tohoto uživatele?')) {
        users = users.filter(u => u.id !== userId);
        await saveState();
        renderPlayers();
      }
    }

    function renderPlayers() {
      const container = document.getElementById('players-list');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';
      document.getElementById('admin-add-student-area').className = isAdmin ? 'mb-8 p-5 bg-gray-900 border border-yellow-600/40 rounded-xl' : 'hidden';

      const displayUsers = users.filter(u => u.role === 'PLAYER' || u.role === 'ADMIN');
      if (displayUsers.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 py-8">Zatím žádní uživatelé.</div>`;
        return;
      }

      const houseDisplayMap = { 
        Gryffindor: { name: 'Nebelvír', class: 'bg-red-950/60 text-red-400 border border-red-700/60' }, 
        Slytherin: { name: 'Zmijozel', class: 'bg-green-950/60 text-green-400 border border-green-700/60' }, 
        Ravenclaw: { name: 'Havraspár', class: 'bg-blue-950/60 text-blue-400 border border-blue-700/60' }, 
        Hufflepuff: { name: 'Mrzimor', class: 'bg-yellow-950/60 text-yellow-400 border border-yellow-700/60' }, 
        None: { name: '-', class: 'bg-gray-800 text-gray-400 border border-gray-700' } 
      };

      container.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-300">
            <thead class="bg-gray-900 text-yellow-500 magic-font uppercase text-xs">
              <tr>
                <th class="p-3">Jméno / Stream</th>
                <th class="p-3">Role</th>
                <th class="p-3">Kolej</th>
                <th class="p-3">Body</th>
                ${isAdmin ? '<th class="p-3 text-right">Akce / Úprava</th>' : ''}
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-800">
              ${displayUsers.map(p => {
                const houseInfo = houseDisplayMap[p.house] || houseDisplayMap['None'];
                const hasStream = p.stream && p.stream.trim() !== '';
                const nameHtml = hasStream 
                  ? `<a href="${p.stream}" target="_blank" class="text-blue-400 hover:underline font-semibold flex items-center gap-1.5"><i class="fa-solid fa-video text-xs"></i> ${p.name}</a>`
                  : `<span class="font-semibold text-white">${p.name}</span>`;

                return `
                  <tr class="hover:bg-gray-900/50">
                    <td class="p-3">${nameHtml}</td>
                    <td class="p-3"><span class="px-2.5 py-0.5 rounded text-xs font-bold ${p.role === 'ADMIN' ? 'bg-yellow-950 text-yellow-400 border border-yellow-700' : 'bg-gray-800 text-blue-400'}">${p.role === 'ADMIN' ? 'Učitel' : 'Student'}</span></td>
                    <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${houseInfo.class}">${houseInfo.name}</span></td>
                    <td class="p-3 font-extrabold text-white">${p.role === 'PLAYER' ? `${p.points || 0} b` : '-'}</td>
                    ${isAdmin ? `
                      <td class="p-3 text-right flex items-center justify-end gap-2">
                        ${p.role === 'PLAYER' ? `
                          <div class="flex items-center gap-1 bg-black/60 p-1 rounded border border-gray-800 text-xs">
                            <button onclick="updateStudentPoints('${p.id}', -5)" class="px-2 py-0.5 bg-gray-800 text-red-400 rounded font-bold">-5</button>
                            <button onclick="updateStudentPoints('${p.id}', 5)" class="px-2 py-0.5 bg-gray-800 text-green-400 rounded font-bold">+5</button>
                          </div>
                        ` : ''}
                        <button onclick="openEditUserModal('${p.id}')" class="text-yellow-400 p-1" title="Upravit profil a body"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteStudent('${p.id}')" class="text-red-400 p-1" title="Smazat"><i class="fa-solid fa-trash"></i></button>
                      </td>
                    ` : ''}
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // --- SKRIPT POSTAV ---
    async function uploadCharactersScript(e) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          const json = JSON.parse(evt.target.result);
          if (Array.isArray(json)) {
            characters = json.filter(item => item && item.name && item.team && item.team !== 'meta').map(item => ({
              id: item.id || Math.random().toString(36).substring(7),
              name: item.name,
              team: item.team || 'townsfolk',
              ability: item.ability || '',
              image: Array.isArray(item.image) ? item.image[0] : (item.image || ''),
              onScript: true,
              visible: true
            }));
            await saveState();
            renderCharacters();
            alert(`Nahráno ${characters.length} postav.`);
          }
        } catch (err) { alert('Chyba parsování JSON.'); }
      };
      reader.readAsText(file);
    }

    async function toggleCharacterProp(charId, prop) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const char = characters.find(c => c.id === charId);
      if (char) {
        char[prop] = !char[prop];
        await saveState();
        renderCharacters();
      }
    }

    function renderCharacters() {
      const container = document.getElementById('characters-container');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';
      const uploadArea = document.getElementById('char-upload-admin-area');
      if (uploadArea) uploadArea.className = isAdmin ? 'mb-6 p-4 bg-gray-900 border border-yellow-600/40 rounded-xl' : 'hidden';

      let displayCharacters = isAdmin ? characters : characters.filter(c => c.visible !== false);
      if (displayCharacters.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-12">Žádné postavy.</div>`;
        return;
      }

      container.innerHTML = displayCharacters.map(c => `
        <div class="border ${c.onScript === false ? 'border-gray-800/50 opacity-60 bg-gray-950/20' : 'border-gray-800 bg-gray-900/40'} rounded-xl p-5 shadow-lg relative flex flex-col justify-between">
          <div>
            <div class="flex items-center space-x-4 mb-3">
              ${c.image ? `<img src="${c.image}" class="w-14 h-14 object-contain rounded-full border border-yellow-500/30 bg-black/40 p-1">` : `<div class="w-14 h-14 rounded-full bg-gray-800 flex items-center justify-center text-yellow-500 magic-font text-xl font-bold">${c.name.charAt(0)}</div>`}
              <div>
                <h3 class="font-bold text-lg text-white magic-font">${c.name}</h3>
                <span class="text-xs font-semibold px-2 py-0.5 rounded-full border border-gray-700 bg-gray-800 text-yellow-400 uppercase">${c.team}</span>
              </div>
            </div>
            <p class="text-sm text-gray-300 mb-4">${c.ability || 'Bez popisu.'}</p>
          </div>
          ${isAdmin ? `
            <div class="border-t border-gray-800 pt-3 mt-2 flex justify-between items-center text-xs">
              <label class="flex items-center gap-1.5 cursor-pointer text-gray-300"><input type="checkbox" ${c.onScript !== false ? 'checked' : ''} onchange="toggleCharacterProp('${c.id}', 'onScript')"> Na scriptu</label>
              <label class="flex items-center gap-1.5 cursor-pointer text-gray-300"><input type="checkbox" ${c.visible !== false ? 'checked' : ''} onchange="toggleCharacterProp('${c.id}', 'visible')"> Viditelné</label>
            </div>
          ` : ''}
        </div>
      `).join('');
    }
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="flex-grow flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-yellow-600/40 p-8 rounded-2xl shadow-2xl w-full max-w-md">
      <h1 class="text-2xl font-bold text-center mb-6 gold-text magic-font">Bradavický Portál</h1>
      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-1">E-mail</label>
          <input type="text" id="login-username" placeholder="student@bradavice.cz" class="w-full bg-black border border-gray-700 rounded-lg p-3 text-white focus:border-yellow-500 focus:outline-none" required>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">Heslo</label>
          <input type="password" id="login-password" class="w-full bg-black border border-gray-700 rounded-lg p-3 text-white focus:border-yellow-500 focus:outline-none" required>
        </div>
        <button type="submit" class="w-full gold-bg text-black font-bold py-3 rounded-lg hover:opacity-95 transition magic-font">Vstoupit do portálu</button>
      </form>
      <div class="mt-6 flex flex-wrap justify-center gap-3 text-sm">
        <button onclick="fillLogin('divak', 'bradavice')" class="text-purple-400 hover:underline">Divák login</button>
      </div>
    </div>
  </div>

  <!-- APP SCREEN -->
  <div id="app-screen" class="hidden flex-grow flex flex-col">
    <header class="bg-black/80 border-b border-yellow-600/30 p-4 flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <h1 class="text-xl font-bold gold-text magic-font">BotC Bradavice</h1>
        <span class="text-xs bg-gray-800 px-3 py-1 rounded-full border border-gray-700 text-gray-300">
          Uživatel: <strong id="user-display-name" class="text-white"></strong> (<span id="user-display-role"></span>)
        </span>
      </div>
      <button onclick="logout()" class="text-red-400 hover:text-red-300 text-sm font-semibold"><i class="fa-solid fa-right-from-bracket"></i> Odhlásit</button>
    </header>

    <nav class="bg-gray-900 border-b border-gray-800 flex overflow-x-auto px-4">
      <button onclick="switchTab('characters')" id="tab-btn-characters" class="tab-btn py-3 px-5 border-b-2 font-medium text-sm border-yellow-500 text-yellow-400 whitespace-nowrap">Postavy & Script</button>
      <button onclick="switchTab('items')" id="tab-btn-items" class="tab-btn py-3 px-5 border-b-2 font-medium text-sm border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Itemy</button>
      <button onclick="switchTab('games')" id="tab-btn-games" class="tab-btn py-3 px-5 border-b-2 font-medium text-sm border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Historie her</button>
      <button onclick="switchTab('players')" id="tab-btn-players" class="tab-btn py-3 px-5 border-b-2 font-medium text-sm border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Studenti</button>
      <button onclick="switchTab('leaderboard')" id="tab-btn-leaderboard" class="tab-btn py-3 px-5 border-b-2 font-medium text-sm border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Bodování kolejí</button>
      <button onclick="switchTab('polls')" id="tab-btn-polls" class="tab-btn py-3 px-5 border-b-2 font-medium text-sm border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Hlasování & Ankety</button>
    </nav>

    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">
      <div id="tab-content-characters" class="tab-content">
        <div id="char-upload-admin-area" class="hidden mb-6 p-4 bg-gray-900 border border-yellow-600/40 rounded-xl">
          <label class="block text-sm font-semibold text-yellow-400 mb-2">Nahrát JSON Script postav:</label>
          <input type="file" accept=".json" onchange="uploadCharactersScript(event)" class="text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-yellow-500 file:text-black hover:file:bg-yellow-400 cursor-pointer">
        </div>
        <div id="characters-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>

      <div id="tab-content-items" class="tab-content hidden">
        <div id="item-admin-btn-area" class="hidden mb-6">
          <button onclick="openItemModal()" class="gold-bg text-black font-bold px-5 py-2.5 rounded-lg hover:opacity-90 transition text-sm flex items-center gap-2"><i class="fa-solid fa-plus"></i> Přidat nový item</button>
        </div>
        <h2 class="text-xl font-bold mb-4 magic-font">Kouzelné předměty & Itemy</h2>
        <div id="items-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </div>

      <div id="tab-content-games" class="tab-content hidden">
        <div id="game-admin-btn-area" class="hidden mb-6">
          <button onclick="openGameModal()" class="gold-bg text-black font-bold px-5 py-2.5 rounded-lg hover:opacity-90 transition text-sm flex items-center gap-2"><i class="fa-solid fa-plus"></i> Zapsat novou hru</button>
        </div>
        <h2 class="text-xl font-bold mb-4 magic-font">Historie odehraných her</h2>
        <div id="games-list"></div>
      </div>

      <div id="tab-content-players" class="tab-content hidden">
        <div id="admin-add-student-area" class="hidden mb-8 p-5 bg-gray-900 border border-yellow-600/40 rounded-xl">
          <h3 class="text-lg font-bold text-yellow-400 magic-font mb-3">Registrovat studenta (po vytvoření v Auth)</h3>
          <form id="add-student-form" onsubmit="addStudent(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <input type="text" id="student-name" placeholder="Celé jméno" class="bg-black border border-gray-700 rounded p-2 text-sm text-white" required>
            <input type="email" id="student-email" placeholder="E-mail (stejný jako v Auth)" class="bg-black border border-gray-700 rounded p-2 text-sm text-white" required>
            <select id="student-role" class="bg-black border border-gray-700 rounded p-2 text-sm text-white">
              <option value="PLAYER">Student (Hráč)</option>
              <option value="ADMIN">Učitel (Admin / GM)</option>
            </select>
            <select id="student-house" class="bg-black border border-gray-700 rounded p-2 text-sm text-white">
              <option value="Gryffindor">Nebelvír</option>
              <option value="Slytherin">Zmijozel</option>
              <option value="Ravenclaw">Havraspár</option>
              <option value="Hufflepuff">Mrzimor</option>
            </select>
            <input type="url" id="student-stream" placeholder="Odkaz na stream (volitelné)" class="bg-black border border-gray-700 rounded p-2 text-sm text-white lg:col-span-2">
            <button type="submit" class="gold-bg text-black font-bold py-2 rounded lg:col-span-3 hover:opacity-90 transition">Propojit a uložit studenta</button>
          </form>
        </div>
        <h2 class="text-xl font-bold mb-4 magic-font">Seznam uživatelů a bodů</h2>
        <div id="players-list"></div>
      </div>

      <div id="tab-content-leaderboard" class="tab-content hidden">
        <div id="admin-max-points-area" class="hidden">
          <label class="text-sm font-semibold text-yellow-400">Maximální možné body pro kampaň (100% náplň):</label>
          <input type="number" id="max-points-input" min="1" class="bg-black border border-gray-700 rounded p-2 text-sm text-white w-32" value="100">
          <button onclick="updateMaxHousePoints()" class="gold-bg text-black font-bold px-4 py-2 rounded text-sm hover:opacity-90">Uložit maximum</button>
        </div>
        <h2 class="text-xl font-bold mb-6 magic-font">Bodování kolejí</h2>
        <div id="house-points-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
      </div>

      <div id="tab-content-polls" class="tab-content hidden">
        <div id="poll-admin-btn-area" class="hidden mb-6">
          <button onclick="openPollModal()" class="gold-bg text-black font-bold px-5 py-2.5 rounded-lg hover:opacity-90 transition text-sm flex items-center gap-2"><i class="fa-solid fa-plus"></i> Vytvořit novou anketu</button>
        </div>
        <h2 class="text-xl font-bold mb-4 magic-font">Aktivní hlasování</h2>
        <div id="polls-list"></div>
      </div>
    </main>
  </div>

  <!-- MODAL: PŘIDAT/UPRAVIT ITEM -->
  <div id="item-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-900 border border-yellow-600/40 p-6 rounded-2xl max-w-md w-full">
      <div class="flex justify-between items-center mb-4">
        <h3 id="item-modal-title" class="text-xl font-bold text-yellow-400 magic-font">Přidat nový item</h3>
        <button onclick="closeItemModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="add-item-form" onsubmit="saveItem(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Obrázek itemu</label>
          <input type="file" accept="image/*" onchange="handleItemImageUpload(event)" class="w-full text-xs text-gray-400 file:bg-yellow-500 file:text-black rounded cursor-pointer mb-2">
          <input type="url" id="item-image-url" placeholder="Nebo vložte URL adresu obrázku..." class="w-full bg-black border border-gray-700 rounded p-2 text-xs text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Název itemu</label>
          <input type="text" id="item-name" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Podrobný popis</label>
          <textarea id="item-desc" rows="3" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required></textarea>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="item-visible" class="w-4 h-4 rounded bg-black border-gray-700 text-yellow-500 focus:ring-0">
          <label for="item-visible" class="text-sm text-gray-300">Zviditelnit hráčům (odškrtnutím skryješ)</label>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-gray-800">
          <button type="button" onclick="closeItemModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded text-sm">Zrušit</button>
          <button type="submit" class="px-4 py-2 gold-bg text-black font-bold rounded text-sm">Uložit item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: UPRAVIT UŽIVATELE -->
  <div id="edit-user-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-900 border border-yellow-600/40 p-6 rounded-2xl max-w-md w-full">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-yellow-400 magic-font">Upravit uživatele</h3>
        <button onclick="closeEditUserModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form onsubmit="saveEditedUser(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Celé jméno</label>
          <input type="text" id="edit-user-name" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Odkaz na stream</label>
          <input type="url" id="edit-user-stream" placeholder="https://twitch.tv/..." class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Body hráče</label>
          <input type="number" id="edit-user-points" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-gray-800">
          <button type="button" onclick="closeEditUserModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded text-sm">Zrušit</button>
          <button type="submit" class="px-4 py-2 gold-bg text-black font-bold rounded text-sm">Uložit změny</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: PŘIDAT/UPRAVIT VYLEPŠENÍ KOLEJE -->
  <div id="upgrade-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-900 border border-yellow-600/40 p-6 rounded-2xl max-w-md w-full">
      <div class="flex justify-between items-center mb-4">
        <h3 id="upgrade-modal-title" class="text-xl font-bold text-yellow-400 magic-font">Nové vylepšení</h3>
        <button onclick="closeUpgradeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="add-upgrade-form" onsubmit="saveUpgrade(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Název vylepšení</label>
          <input type="text" id="upgrade-title" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Podrobný popis</label>
          <textarea id="upgrade-desc" rows="3" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required></textarea>
        </div>
        <div class="flex items-center gap-2">
          <input type="checkbox" id="upgrade-visible" class="w-4 h-4 rounded bg-black border-gray-700 text-yellow-500 focus:ring-0">
          <label for="upgrade-visible" class="text-sm text-gray-300">Zviditelnit hráčům (odškrtnutím skryješ)</label>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-gray-800">
          <button type="button" onclick="closeUpgradeModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded text-sm">Zrušit</button>
          <button type="submit" class="px-4 py-2 gold-bg text-black font-bold rounded text-sm">Uložit vylepšení</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: ANKETY -->
  <div id="poll-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-900 border border-yellow-600/40 p-6 rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="poll-modal-title" class="text-xl font-bold text-yellow-400 magic-font">Nová anketa</h3>
        <button onclick="closePollModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="add-poll-form" onsubmit="savePoll(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Otázka</label>
          <input type="text" id="poll-title-input" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Max. hlasů na hráče</label>
          <input type="number" id="poll-max-votes" min="1" max="10" value="1" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-2">Možnosti</label>
          <div id="poll-options-container" class="space-y-2"></div>
          <button type="button" onclick="addPollOptionInput()" class="mt-3 text-xs text-yellow-400 hover:underline"><i class="fa-solid fa-plus"></i> Přidat možnost</button>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-gray-800">
          <button type="button" onclick="closePollModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded text-sm">Zrušit</button>
          <button type="submit" class="px-4 py-2 gold-bg text-black font-bold rounded text-sm">Uložit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: HISTORIE HER -->
  <div id="game-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-900 border border-yellow-600/40 p-6 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="game-modal-title" class="text-xl font-bold text-yellow-400 magic-font">Zapsat hru</h3>
        <button onclick="closeGameModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="add-game-form" onsubmit="saveGame(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Název</label>
            <input type="text" id="game-title-input" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Vítězná strana</label>
            <select id="game-winner-input" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white">
              <option value="GOOD">Dobro</option>
              <option value="EVIL">Zlo</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">JSON Scénář</label>
            <input type="file" accept=".json" onchange="handleGameScriptUpload(event)" class="w-full text-xs text-gray-400 file:bg-yellow-500 file:text-black rounded cursor-pointer">
          </div>
        </div>
        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-semibold text-yellow-400">Hráči</label>
            <button type="button" onclick="addGamePlayerRow()" class="text-xs bg-gray-800 text-yellow-400 px-3 py-1.5 rounded"><i class="fa-solid fa-user-plus"></i> Přidat</button>
          </div>
          <div id="modal-game-players-container" class="max-h-60 overflow-y-auto pr-1"></div>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-gray-800">
          <button type="button" onclick="closeGameModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded text-sm">Zrušit</button>
          <button type="submit" class="px-4 py-2 gold-bg text-black font-bold rounded text-sm">Uložit hru</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
