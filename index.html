<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harry Potter x Blood on the Clocktower</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@300;400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #c5c6c7; }
    h1, h2, h3, .magic-font { font-family: 'Cinzel', serif; }
    .gold-border { border-color: #d4af37; }
    .gold-text { color: #d4af37; }
    .gold-bg { background-color: #d4af37; }
  </style>
  <script>
    const SUPABASE_URL = "https://tnvftxeohsxwazsnwfip.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_to3lCwqIAYz3vQgq0gVK-w_Y4nLAbTN"; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // BEZPEČNÉ: Žádná hesla ani admin účty již nejsou zapsány v JS kódu!
    const defaultUsers = [
      { id: 3, username: 'divak', password: 'bradavice', name: 'Divák zvenčí', role: 'SPECTATOR', house: 'None', points: 0, stream: '' }
    ];

    const defaultHousePoints = { Gryffindor: 150, Slytherin: 120, Ravenclaw: 140, Hufflepuff: 110 };

    let currentUser = null;
    let users = defaultUsers;
    let characters = [];
    let games = [];
    let polls = [];
    let housePoints = defaultHousePoints;
    let activeTab = 'characters';

    let tempGamePlayers = [];
    let tempGameCharacters = [];

    let editingGameId = null;
    let editingPollId = null;
    let editingUserId = null;

    async function loadStateFromCloud() {
      try {
        const { data, error } = await supabaseClient
          .from('app_data')
          .select('payload')
          .eq('id', 1)
          .single();

        if (error) {
          console.error('Chyba při načítání ze Supabase:', error);
          return;
        }

        if (data && data.payload) {
          const p = data.payload;
          users = p.users && p.users.length > 0 ? p.users : defaultUsers;
          users.forEach(u => { 
            if (u.points === undefined) u.points = 0; 
            if (u.stream === undefined) u.stream = '';
          });
          
          characters = (p.characters || []).map(c => ({
            ...c,
            onScript: c.onScript !== undefined ? c.onScript : true,
            visible: c.visible !== undefined ? c.visible : true
          }));

          games = p.games || [];
          polls = p.polls || [];
          housePoints = p.housePoints || defaultHousePoints;
        }
      } catch (err) {
        console.error('Chyba připojení k databázi:', err);
      }
    }

    async function saveState() {
      const payloadData = { users, characters, games, polls, housePoints };
      try {
        const { error } = await supabaseClient
          .from('app_data')
          .upsert({ id: 1, payload: payloadData });

        if (error) {
          console.error('Chyba při ukládání do Supabase:', error);
        } else {
          console.log('Data úspěšně uložena do cloudu.');
        }
      } catch (err) {
        console.error('Chyba připojení k databázi:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await loadStateFromCloud();
      renderCurrentTab();
    });

    function fillLogin(u, p) {
      document.getElementById('login-username').value = u;
      document.getElementById('login-password').value = p;
    }

    function handleLogin(e) {
      if (e) e.preventDefault();
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();
      const found = users.find(user => user.username.toLowerCase() === u.toLowerCase() && user.password === p);
      if (found) {
        currentUser = found;
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('user-display-name').textContent = currentUser.name;
        
        let roleName = 'Hráč';
        if (currentUser.role === 'ADMIN') roleName = 'Učitel (Admin / GM)';
        if (currentUser.role === 'SPECTATOR') roleName = 'Divák';
        document.getElementById('user-display-role').textContent = roleName;

        renderCurrentTab();
      } else {
        alert('Neplatné uživatelské jméno nebo heslo!');
      }
    }

    function logout() {
      currentUser = null;
      document.getElementById('app-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('border-yellow-500', 'text-yellow-400');
        btn.classList.add('border-transparent', 'text-gray-400');
      });
      const activeBtn = document.getElementById(`tab-btn-${tab}`);
      if (activeBtn) {
        activeBtn.classList.remove('border-transparent', 'text-gray-400');
        activeBtn.classList.add('border-yellow-500', 'text-yellow-400');
      }
      renderCurrentTab();
    }

    function renderCurrentTab() {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      const activeContent = document.getElementById(`tab-content-${activeTab}`);
      if (activeContent) activeContent.classList.remove('hidden');

      if (activeTab === 'characters') renderCharacters();
      if (activeTab === 'games') renderGames();
      if (activeTab === 'players') renderPlayers();
      if (activeTab === 'leaderboard') renderLeaderboard();
      if (activeTab === 'polls') renderPolls();
    }

    // --- ANKETY ---
    function openPollModal(pollId = null) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      
      editingPollId = pollId;
      const modalTitle = document.getElementById('poll-modal-title');
      const container = document.getElementById('poll-options-container');
      container.innerHTML = '';

      if (pollId) {
        modalTitle.textContent = 'Upravit anketu';
        const poll = polls.find(p => p.id === pollId);
        if (poll) {
          document.getElementById('poll-title-input').value = poll.title;
          document.getElementById('poll-max-votes').value = poll.maxVotes || 1;
          
          poll.options.forEach(opt => {
            addPollOptionInput(opt.text);
          });
        }
      } else {
        modalTitle.textContent = 'Nová anketa';
        document.getElementById('add-poll-form').reset();
        addPollOptionInput();
        addPollOptionInput();
      }

      document.getElementById('poll-modal').classList.remove('hidden');
    }

    function closePollModal() {
      document.getElementById('poll-modal').classList.add('hidden');
      document.getElementById('add-poll-form').reset();
      editingPollId = null;
    }

    function addPollOptionInput(initialValue = '') {
      const container = document.getElementById('poll-options-container');
      const count = container.children.length;
      if (count >= 10) {
        alert('Lze přidat maximálně 10 možností!');
        return;
      }
      const div = document.createElement('div');
      div.className = "flex gap-2 items-center";
      div.innerHTML = `
        <input type="text" value="${initialValue}" placeholder="Možnost ${count + 1}" class="poll-option-input flex-grow bg-black border border-gray-700 rounded p-2 text-sm text-white" required>
        ${count >= 2 ? `<button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>` : ''}
      `;
      container.appendChild(div);
    }

    async function savePoll(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const title = document.getElementById('poll-title-input').value.trim();
      const maxVotes = parseInt(document.getElementById('poll-max-votes').value) || 1;
      const optionInputs = document.querySelectorAll('.poll-option-input');
      
      const newOptionsText = [];
      optionInputs.forEach(input => {
        const val = input.value.trim();
        if (val) newOptionsText.push(val);
      });

      if (newOptionsText.length < 2) {
        alert('Anketa musí mít alespoň 2 možnosti!');
        return;
      }

      if (editingPollId) {
        const poll = polls.find(p => p.id === editingPollId);
        if (poll) {
          poll.title = title;
          poll.maxVotes = maxVotes;
          
          poll.options = newOptionsText.map(text => {
            const existingOpt = poll.options.find(o => o.text === text);
            return {
              text: text,
              votes: existingOpt ? existingOpt.votes : []
            };
          });
        }
      } else {
        polls.unshift({
          id: Date.now(),
          title,
          maxVotes,
          closed: false,
          options: newOptionsText.map(t => ({ text: t, votes: [] }))
        });
      }

      await saveState();
      closePollModal();
      renderPolls();
    }

    async function togglePollClose(pollId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const poll = polls.find(p => p.id === pollId);
      if (poll) {
        poll.closed = !poll.closed;
        await saveState();
        renderPolls();
      }
    }

    async function deletePoll(pollId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      if (confirm('Opravdu chcete smazat tuto anketu?')) {
        polls = polls.filter(p => p.id !== pollId);
        await saveState();
        renderPolls();
      }
    }

    async function votePoll(pollId, optionIndex) {
      if (!currentUser || currentUser.role === 'SPECTATOR') {
        alert('Diváci nemohou hlasovat v anketách.');
        return;
      }
      const poll = polls.find(p => p.id === pollId);
      if (!poll || poll.closed) return;

      const userVotesCount = poll.options.filter(opt => opt.votes.includes(currentUser.id)).length;
      const hasVotedThis = poll.options[optionIndex].votes.includes(currentUser.id);

      if (hasVotedThis) {
        poll.options[optionIndex].votes = poll.options[optionIndex].votes.filter(id => id !== currentUser.id);
      } else {
        if (userVotesCount >= poll.maxVotes) {
          alert(`V této anketě můžeš hlasovat maximálně pro ${poll.maxVotes} možnosti!`);
          return;
        }
        poll.options[optionIndex].votes.push(currentUser.id);
      }

      await saveState();
      renderPolls();
    }

    function renderPolls() {
      const container = document.getElementById('polls-list');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';
      document.getElementById('poll-admin-btn-area').className = isAdmin ? 'mb-6' : 'hidden';

      if (polls.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 py-8">Zatím nebyly vytvořeny žádné ankety.</div>`;
        return;
      }

      container.innerHTML = polls.map(p => {
        let maxVotesCount = 0;
        if (p.closed && p.options) {
          maxVotesCount = Math.max(...p.options.map(o => o.votes ? o.votes.length : 0));
        }

        return `
          <div class="bg-gray-900 border ${p.closed ? 'border-red-900/40 bg-gray-950/80' : 'border-yellow-600/30'} p-5 rounded-xl mb-4 shadow-lg relative">
            ${isAdmin ? `
              <div class="absolute top-4 right-4 flex gap-2">
                <button onclick="openPollModal(${p.id})" class="text-yellow-400 hover:text-yellow-300 text-sm p-1" title="Upravit anketu"><i class="fa-solid fa-pen"></i></button>
                <button onclick="togglePollClose(${p.id})" class="text-xs px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 text-gray-200 border border-gray-700">
                  ${p.closed ? '<i class="fa-solid fa-lock-open mr-1"></i> Otevřít' : '<i class="fa-solid fa-lock mr-1"></i> Uzavřít'}
                </button>
                <button onclick="deletePoll(${p.id})" class="text-red-400 hover:text-red-300 text-sm p-1" title="Smazat anketu"><i class="fa-solid fa-trash"></i></button>
              </div>
            ` : ''}
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-2 pr-28 gap-2">
              <h3 class="text-lg font-bold text-white magic-font flex items-center gap-2">
                ${p.title}
                ${p.closed ? '<span class="text-xs bg-red-950 text-red-400 border border-red-700 px-2 py-0.5 rounded uppercase font-sans font-bold">UZAVŘENO</span>' : ''}
              </h3>
              <span class="text-xs bg-yellow-500/20 text-yellow-400 border border-yellow-500/40 px-2.5 py-1 rounded-full font-semibold w-fit">Max ${p.maxVotes} hlas/ů</span>
            </div>
            <div class="space-y-2 mt-4">
              ${p.options.map((opt, idx) => {
                const hasVoted = currentUser && opt.votes.includes(currentUser.id);
                const isWinner = p.closed && maxVotesCount > 0 && opt.votes.length === maxVotesCount;

                return `
                  <button onclick="votePoll(${p.id}, ${idx})" ${p.closed ? 'disabled' : ''} class="w-full text-left p-3 rounded-lg border ${hasVoted ? 'border-yellow-500 bg-yellow-500/20 text-yellow-300' : 'border-gray-800 bg-black/40 text-gray-300'} ${p.closed ? 'cursor-not-allowed opacity-90' : 'hover:border-yellow-600'} transition flex justify-between items-center">
                    <span class="text-sm font-semibold">${opt.text}</span>
                    <span class="text-xs px-2.5 py-1 rounded-full font-bold ${isWinner ? 'bg-green-600 text-white font-extrabold shadow-lg shadow-green-900/50' : 'bg-gray-800 text-gray-400'}">
                      ${opt.votes.length} hlasů ${isWinner ? '★' : ''}
                    </span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    // --- HISTORIE HER ---
    function openGameModal(gameId = null) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      
      editingGameId = gameId;
      const modalTitle = document.getElementById('game-modal-title');
      
      if (gameId) {
        modalTitle.textContent = 'Upravit hru';
        const game = games.find(g => g.id === gameId);
        if (game) {
          document.getElementById('game-title-input').value = game.title;
          document.getElementById('game-winner-input').value = game.winningTeam;
          
          tempGameCharacters = [...characters];
          tempGamePlayers = game.players ? game.players.map(p => {
            const userObj = users.find(u => u.name === p.studentName);
            return {
              userId: userObj ? userObj.id : '',
              charName: p.charName,
              startAlignment: p.startAlignment || 'GOOD',
              endAlignment: p.endAlignment || 'GOOD'
            };
          }) : [];
        }
      } else {
        modalTitle.textContent = 'Zapsat novou hru';
        document.getElementById('add-game-form').reset();
        tempGamePlayers = [];
        tempGameCharacters = [...characters];
      }

      document.getElementById('game-modal').classList.remove('hidden');
      renderModalPlayersRows();
    }

    function closeGameModal() {
      document.getElementById('game-modal').classList.add('hidden');
      document.getElementById('add-game-form').reset();
      editingGameId = null;
    }

    function handleGameScriptUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const json = JSON.parse(evt.target.result);
          if (Array.isArray(json)) {
            tempGameCharacters = json.filter(item => item && item.name && item.team && item.team !== 'meta').map(item => ({
              name: item.name,
              team: item.team || 'townsfolk'
            }));
            renderModalPlayersRows();
            alert(`Scénář úspěšně nahrán (${tempGameCharacters.length} postav)!`);
          } else {
            alert('JSON nemá správný formát pole.');
          }
        } catch (err) {
          alert('Chyba při čtení JSON souboru.');
        }
      };
      reader.readAsText(file);
    }

    function addGamePlayerRow() {
      if (tempGamePlayers.length >= 20) {
        alert('Lze přidat maximálně 20 studentů do jedné hry!');
        return;
      }
      tempGamePlayers.push({ userId: '', charName: '', startAlignment: 'GOOD', endAlignment: 'GOOD' });
      renderModalPlayersRows();
    }

    function removeGamePlayerRow(index) {
      tempGamePlayers.splice(index, 1);
      renderModalPlayersRows();
    }

    function renderModalPlayersRows() {
      const container = document.getElementById('modal-game-players-container');
      const registeredPlayers = users.filter(u => u.role === 'PLAYER');
      const availableChars = tempGameCharacters.length > 0 ? tempGameCharacters : characters;

      container.innerHTML = tempGamePlayers.map((p, idx) => `
        <div class="grid grid-cols-1 md:grid-cols-5 gap-2 bg-black/50 p-3 rounded-lg border border-gray-800 items-center mb-2 text-xs">
          <div>
            <label class="block text-gray-400 text-[10px] mb-0.5">Student</label>
            <select onchange="tempGamePlayers[${idx}].userId = this.value" class="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white" required>
              <option value="">-- Vybrat studenta --</option>
              ${registeredPlayers.map(u => `<option value="${u.id}" ${p.userId == u.id ? 'selected' : ''}>${u.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-gray-400 text-[10px] mb-0.5">Postava</label>
            <select onchange="tempGamePlayers[${idx}].charName = this.value" class="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white" required>
              <option value="">-- Vybrat postavu --</option>
              ${availableChars.map(c => `<option value="${c.name}" ${p.charName === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-gray-400 text-[10px] mb-0.5">Začátek (Příslušnost)</label>
            <select onchange="tempGamePlayers[${idx}].startAlignment = this.value" class="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white">
              <option value="GOOD" ${p.startAlignment === 'GOOD' ? 'selected' : ''}>Dobro</option>
              <option value="EVIL" ${p.startAlignment === 'EVIL' ? 'selected' : ''}>Zlo</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-400 text-[10px] mb-0.5">Konec (Příslušnost)</label>
            <select onchange="tempGamePlayers[${idx}].endAlignment = this.value" class="w-full bg-gray-900 border border-gray-700 rounded p-1 text-white">
              <option value="GOOD" ${p.endAlignment === 'GOOD' ? 'selected' : ''}>Dobro</option>
              <option value="EVIL" ${p.endAlignment === 'EVIL' ? 'selected' : ''}>Zlo</option>
            </select>
          </div>
          <div class="flex justify-end items-end h-full">
            <button type="button" onclick="removeGamePlayerRow(${idx})" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i> Odebrat</button>
          </div>
        </div>
      `).join('');
    }

    async function saveGame(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const title = document.getElementById('game-title-input').value.trim();
      const winningTeam = document.getElementById('game-winner-input').value;
      const date = new Date().toLocaleDateString('cs-CZ');

      const evaluatedPlayers = tempGamePlayers.map(p => {
        const studentObj = users.find(u => u.id == p.userId);
        const isWinner = p.endAlignment === winningTeam;
        return {
          studentName: studentObj ? studentObj.name : 'Neznámý',
          charName: p.charName || 'Nespecifikováno',
          startAlignment: p.startAlignment,
          endAlignment: p.endAlignment,
          won: isWinner
        };
      });

      if (editingGameId) {
        const gameIndex = games.findIndex(g => g.id === editingGameId);
        if (gameIndex !== -1) {
          games[gameIndex].title = title;
          games[gameIndex].winningTeam = winningTeam;
          games[gameIndex].players = evaluatedPlayers;
        }
      } else {
        games.unshift({ id: Date.now(), title, winningTeam, date, players: evaluatedPlayers });
      }

      await saveState();
      closeGameModal();
      renderGames();
    }

    async function deleteGame(gameId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      if (confirm('Opravdu chcete smazat tuto hru z historie?')) {
        games = games.filter(g => g.id !== gameId);
        await saveState();
        renderGames();
      }
    }

    function renderGames() {
      const container = document.getElementById('games-list');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';
      document.getElementById('game-admin-btn-area').className = isAdmin ? 'mb-6' : 'hidden';

      if (games.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 py-8">Zatím nebyly odehrány žádné hry.</div>`;
        return;
      }

      container.innerHTML = games.map(g => `
        <div class="bg-gray-900 border ${g.winningTeam === 'GOOD' ? 'border-blue-600/50' : 'border-red-600/50'} p-5 rounded-xl mb-4 shadow-lg relative">
          ${isAdmin ? `
            <div class="absolute top-4 right-4 flex gap-2">
              <button onclick="openGameModal(${g.id})" class="text-yellow-400 hover:text-yellow-300 text-sm p-1" title="Upravit hru"><i class="fa-solid fa-pen"></i></button>
              <button onclick="deleteGame(${g.id})" class="text-red-400 hover:text-red-300 text-sm p-1" title="Smazat hru"><i class="fa-solid fa-trash"></i></button>
            </div>
          ` : ''}
          <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-gray-800 pb-3 mb-3 gap-2 pr-16">
            <div>
              <h3 class="text-lg font-bold text-white magic-font">${g.title}</h3>
              <span class="text-xs px-2.5 py-0.5 rounded-full font-bold ${g.winningTeam === 'GOOD' ? 'bg-blue-950 text-blue-400 border border-blue-700' : 'bg-red-950 text-red-400 border border-red-700'}">
                Vítězná strana: ${g.winningTeam === 'GOOD' ? 'Dobro' : 'Zlo'}
              </span>
            </div>
            <div class="text-xs text-gray-500"><i class="fa-regular fa-calendar mr-1"></i> ${g.date}</div>
          </div>
          ${g.players && g.players.length > 0 ? `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 text-xs">
              ${g.players.map(p => `
                <div class="p-2 rounded border ${p.won ? 'bg-green-950/20 border-green-800/50 text-green-300' : 'bg-red-950/20 border-red-800/50 text-red-300'} flex justify-between items-center">
                  <div>
                    <strong class="text-white">${p.studentName}</strong> (${p.charName})
                    <div class="text-[10px] text-gray-400">Příslušnost: ${p.startAlignment === 'GOOD' ? 'Dobro' : 'Zlo'} → ${p.endAlignment === 'GOOD' ? 'Dobro' : 'Zlo'}</div>
                  </div>
                  <span class="font-bold px-1.5 py-0.5 rounded ${p.won ? 'bg-green-900 text-green-200' : 'bg-red-900 text-red-200'}">${p.won ? 'VÝHRA' : 'PROHRA'}</span>
                </div>
              `).join('')}
            </div>
          ` : '<div class="text-xs text-gray-500">Žádní zapsaní hráči.</div>'}
        </div>
      `).join('');
    }

    // --- BODOVÁNÍ KOLEJÍ ---
    async function updateHousePoints(house, delta) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      if (!housePoints[house]) housePoints[house] = 0;
      housePoints[house] += delta;
      await saveState();
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const container = document.getElementById('house-points-container');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';

      const housesMeta = {
        Gryffindor: { name: 'Nebelvír', color: 'border-red-700 bg-red-950/30 text-red-400', icon: 'fa-shield-halved' },
        Slytherin: { name: 'Zmijozel', color: 'border-green-700 bg-green-950/30 text-green-400', icon: 'fa-staff-snake' },
        Ravenclaw: { name: 'Havraspár', color: 'border-blue-700 bg-blue-950/30 text-blue-400', icon: 'fa-feather' },
        Hufflepuff: { name: 'Mrzimor', color: 'border-yellow-700 bg-yellow-950/30 text-yellow-400', icon: 'fa-sun' }
      };

      container.innerHTML = Object.keys(housesMeta).map(key => {
        const meta = housesMeta[key];
        const points = housePoints[key] || 0;
        return `
          <div class="border ${meta.color} rounded-2xl p-6 flex flex-col justify-between shadow-xl">
            <div>
              <div class="flex items-center justify-between mb-4">
                <h3 class="text-2xl font-bold magic-font">${meta.name}</h3>
                <i class="fa-solid ${meta.icon} text-2xl"></i>
              </div>
              <div class="text-4xl font-extrabold text-white mb-4 magic-font">${points} <span class="text-sm text-gray-400 font-normal">bodů</span></div>
            </div>
            ${isAdmin ? `
              <div class="border-t border-gray-800 pt-4 grid grid-cols-4 gap-2 text-xs font-bold">
                <button onclick="updateHousePoints('${key}', 10)" class="bg-gray-800 hover:bg-green-900 text-green-400 py-2 rounded">+10</button>
                <button onclick="updateHousePoints('${key}', 50)" class="bg-gray-800 hover:bg-green-900 text-green-400 py-2 rounded">+50</button>
                <button onclick="updateHousePoints('${key}', -10)" class="bg-gray-800 hover:bg-red-900 text-red-400 py-2 rounded">-10</button>
                <button onclick="updateHousePoints('${key}', -50)" class="bg-gray-800 hover:bg-red-900 text-red-400 py-2 rounded">-50</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // --- STUDENTI / UČITELÉ ---
    async function addStudent(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const name = document.getElementById('student-name').value.trim();
      const username = document.getElementById('student-username').value.trim();
      const pass = document.getElementById('student-pass').value.trim();
      const role = document.getElementById('student-role').value;
      const house = document.getElementById('student-house').value;
      const stream = document.getElementById('student-stream').value.trim();

      if (users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
        alert('Uživatel s tímto jménem již existuje!');
        return;
      }

      users.push({ 
        id: Date.now(), 
        username, 
        password: pass, 
        name, 
        role, 
        house, 
        points: 0,
        stream 
      });
      await saveState();
      document.getElementById('add-student-form').reset();
      renderPlayers();
    }

    function openEditUserModal(userId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      editingUserId = userId;
      const user = users.find(u => u.id === userId);
      if (user) {
        document.getElementById('edit-user-name').value = user.name;
        document.getElementById('edit-user-pass').value = user.password;
        document.getElementById('edit-user-stream').value = user.stream || '';
        document.getElementById('edit-user-modal').classList.remove('hidden');
      }
    }

    function closeEditUserModal() {
      document.getElementById('edit-user-modal').classList.add('hidden');
      editingUserId = null;
    }

    async function saveEditedUser(e) {
      e.preventDefault();
      if (!currentUser || currentUser.role !== 'ADMIN' || !editingUserId) return;
      
      const user = users.find(u => u.id === editingUserId);
      if (user) {
        user.name = document.getElementById('edit-user-name').value.trim();
        user.password = document.getElementById('edit-user-pass').value.trim();
        user.stream = document.getElementById('edit-user-stream').value.trim();
        
        await saveState();
        closeEditUserModal();
        renderPlayers();
      }
    }

    async function updateStudentPoints(userId, delta) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const student = users.find(u => u.id === userId);
      if (student) {
        if (student.points === undefined) student.points = 0;
        student.points += delta;
        await saveState();
        renderPlayers();
      }
    }

    async function deleteStudent(userId) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      if (confirm('Opravdu chcete smazat tohoto uživatele?')) {
        users = users.filter(u => u.id !== userId);
        await saveState();
        renderPlayers();
      }
    }

    function renderPlayers() {
      const container = document.getElementById('players-list');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';
      document.getElementById('admin-add-student-area').className = isAdmin ? 'mb-8 p-5 bg-gray-900 border border-yellow-600/40 rounded-xl' : 'hidden';

      const displayUsers = users.filter(u => u.role === 'PLAYER' || u.role === 'ADMIN');

      if (displayUsers.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 py-8">Zatím nejsou zapsáni žádní uživatelé.</div>`;
        return;
      }

      const houseDisplayMap = { 
        Gryffindor: { name: 'Nebelvír', class: 'bg-red-950/60 text-red-400 border border-red-700/60' }, 
        Slytherin: { name: 'Zmijozel', class: 'bg-green-950/60 text-green-400 border border-green-700/60' }, 
        Ravenclaw: { name: 'Havraspár', class: 'bg-blue-950/60 text-blue-400 border border-blue-700/60' }, 
        Hufflepuff: { name: 'Mrzimor', class: 'bg-yellow-950/60 text-yellow-400 border border-yellow-700/60' }, 
        None: { name: '-', class: 'bg-gray-800 text-gray-400 border border-gray-700' } 
      };

      container.innerHTML = `
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm text-gray-300">
            <thead class="bg-gray-900 text-yellow-500 magic-font uppercase text-xs">
              <tr>
                <th class="p-3">Jméno</th>
                <th class="p-3">Role</th>
                <th class="p-3">Kolej</th>
                <th class="p-3">Body pro kolej</th>
                ${isAdmin ? '<th class="p-3 text-right">Akce / Úprava bodů</th>' : ''}
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-800">
              ${displayUsers.map(p => {
                const houseInfo = houseDisplayMap[p.house] || houseDisplayMap['None'];
                const hasStream = p.stream && p.stream.trim() !== '';
                
                const nameHtml = hasStream 
                  ? `<a href="${p.stream}" target="_blank" class="text-blue-400 hover:text-blue-300 underline font-semibold flex items-center gap-1.5" title="Otevřít stream"><i class="fa-solid fa-video text-xs"></i> ${p.name}</a>`
                  : `<span class="font-semibold text-white">${p.name}</span>`;

                return `
                  <tr class="hover:bg-gray-900/50">
                    <td class="p-3">${nameHtml}</td>
                    <td class="p-3"><span class="px-2.5 py-0.5 rounded text-xs font-bold ${p.role === 'ADMIN' ? 'bg-yellow-950 text-yellow-400 border border-yellow-700' : 'bg-gray-800 text-blue-400'}">${p.role === 'ADMIN' ? 'Učitel (Admin)' : 'Student'}</span></td>
                    <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold ${houseInfo.class}">${houseInfo.name}</span></td>
                    <td class="p-3 font-extrabold text-white">${p.role === 'PLAYER' ? `${p.points || 0} b` : '<span class="text-gray-500 font-normal">-</span>'}</td>
                    ${isAdmin ? `
                      <td class="p-3 text-right flex items-center justify-end gap-2">
                        ${p.role === 'PLAYER' ? `
                          <div class="flex items-center gap-1 bg-black/60 p-1 rounded border border-gray-800 text-xs">
                            <button onclick="updateStudentPoints(${p.id}, 5)" class="px-2 py-0.5 bg-gray-800 hover:bg-green-900 text-green-400 rounded font-bold" title="Přidat 5 bodů">+5</button>
                            <button onclick="updateStudentPoints(${p.id}, -5)" class="px-2 py-0.5 bg-gray-800 hover:bg-red-900 text-red-400 rounded font-bold" title="Odebrat 5 bodů">-5</button>
                          </div>
                        ` : ''}
                        <button onclick="openEditUserModal(${p.id})" class="text-yellow-400 hover:text-yellow-300 text-xs p-1" title="Upravit uživatele"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteStudent(${p.id})" class="text-red-400 hover:text-red-300 text-xs p-1" title="Smazat uživatele"><i class="fa-solid fa-trash"></i></button>
                      </td>
                    ` : ''}
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // --- SKRIPT POSTAV ---
    async function uploadCharactersScript(e) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          const json = JSON.parse(evt.target.result);
          if (Array.isArray(json)) {
            const validItems = json.filter(item => item && item.name && item.team && item.team !== 'meta');
            characters = validItems.map(item => ({
              id: item.id || Math.random().toString(36).substring(7),
              name: item.name,
              team: item.team || 'townsfolk',
              ability: item.ability || '',
              image: Array.isArray(item.image) ? item.image[0] : (item.image || ''),
              onScript: true,
              visible: true
            }));
            await saveState();
            renderCharacters();
            alert(`Úspěšně nahráno ${characters.length} postav!`);
          }
        } catch (err) {
          alert('Chyba při parsování JSON.');
        }
      };
      reader.readAsText(file);
    }

    async function toggleCharacterProp(charId, prop) {
      if (!currentUser || currentUser.role !== 'ADMIN') return;
      const char = characters.find(c => c.id === charId);
      if (char) {
        char[prop] = !char[prop];
        await saveState();
        renderCharacters();
      }
    }

    function renderCharacters() {
      const container = document.getElementById('characters-container');
      const isAdmin = currentUser && currentUser.role === 'ADMIN';
      const uploadArea = document.getElementById('char-upload-admin-area');
      if (uploadArea) {
        uploadArea.className = isAdmin ? 'mb-6 p-4 bg-gray-900 border border-yellow-600/40 rounded-xl' : 'hidden';
      }

      let displayCharacters = characters;
      if (!isAdmin) {
        displayCharacters = characters.filter(c => c.visible !== false);
      }

      if (displayCharacters.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center text-gray-500 py-12">Žádné postavy nejsou k dispozici.</div>`;
        return;
      }

      container.innerHTML = displayCharacters.map(c => `
        <div class="border ${c.onScript === false ? 'border-gray-800/50 opacity-60 bg-gray-950/20' : 'border-gray-800 bg-gray-900/40'} rounded-xl p-5 shadow-lg relative flex flex-col justify-between">
          <div>
            <div class="flex items-center space-x-4 mb-3">
              ${c.image ? `<img src="${c.image}" class="w-14 h-14 object-contain rounded-full border border-yellow-500/30 bg-black/40 p-1">` : `<div class="w-14 h-14 rounded-full bg-gray-800 flex items-center justify-center text-yellow-500 magic-font text-xl font-bold">${c.name.charAt(0)}</div>`}
              <div>
                <h3 class="font-bold text-lg text-white magic-font">${c.name}</h3>
                <div class="flex flex-wrap gap-1 mt-1">
                  <span class="text-xs font-semibold px-2 py-0.5 rounded-full border border-gray-700 bg-gray-800 text-yellow-400 uppercase tracking-wider">${c.team}</span>
                  ${c.onScript === false ? '<span class="text-[10px] px-1.5 py-0.5 bg-red-950 text-red-400 border border-red-800 rounded">Mimo script</span>' : ''}
                  ${c.visible === false ? '<span class="text-[10px] px-1.5 py-0.5 bg-gray-800 text-gray-400 border border-gray-700 rounded">Skryto</span>' : ''}
                </div>
              </div>
            </div>
            <p class="text-sm text-gray-300 mb-4 leading-relaxed">${c.ability || 'Bez popisu.'}</p>
          </div>
          ${isAdmin ? `
            <div class="border-t border-gray-800 pt-3 mt-2 flex justify-between items-center text-xs">
              <label class="flex items-center gap-1.5 cursor-pointer text-gray-300 hover:text-white">
                <input type="checkbox" ${c.onScript !== false ? 'checked' : ''} onchange="toggleCharacterProp('${c.id}', 'onScript')" class="rounded bg-black border-gray-700 text-yellow-500 focus:ring-0">
                <span>Na scriptu</span>
              </label>
              <label class="flex items-center gap-1.5 cursor-pointer text-gray-300 hover:text-white">
                <input type="checkbox" ${c.visible !== false ? 'checked' : ''} onchange="toggleCharacterProp('${c.id}', 'visible')" class="rounded bg-black border-gray-700 text-yellow-500 focus:ring-0">
                <span>Viditelné pro studenty</span>
              </label>
            </div>
          ` : ''}
        </div>
      `).join('');
    }
  </script>
</head>
<body class="min-h-screen flex flex-col">

  <!-- LOGIN SCREEN -->

      <button onclick="switchTab('games')" id="tab-btn-games" class="tab-btn py-3 px-5 border-b-2 font-medium text-sm border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Historie her</button>
      <button onclick="switchTab('players')" id="tab-btn-players" class="tab-btn py-3 px-5 border-b-2 font-medium text-sm border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Studenti</button>
      <button onclick="switchTab('leaderboard')" id="tab-btn-leaderboard" class="tab-btn py-3 px-5 border-b-2 font-medium text-sm border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Bodování kolejí</button>
      <button onclick="switchTab('polls')" id="tab-btn-polls" class="tab-btn py-3 px-5 border-b-2 font-medium text-sm border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">Hlasování & Ankety</button>
    </nav>

    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">

      <div id="tab-content-characters" class="tab-content">

          </button>

        <h2 class="text-xl font-bold mb-4 magic-font">Historie odehraných her</h2>
        <div id="games-list"></div>

      <!-- STUDENTI / UČITELÉ -->
      <div id="tab-content-players" class="tab-content hidden">

          <h3 class="text-lg font-bold text-yellow-400 magic-font mb-3">Registrovat nového uživatele (Student / Učitel)</h3>

      <div class="flex justify-between items-center mb-4">

  <!-- MODAL: ANKETY -->
  <div id="poll-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">

      <div class="flex justify-between items-center mb-4">
        <h3 id="poll-modal-title" class="text-xl font-bold text-yellow-400 magic-font">Nová anketa</h3>
        <button onclick="closePollModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>

      <form id="add-poll-form" onsubmit="savePoll(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Otázka ankety</label>
          <input type="text" id="poll-title-input" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required>

          <label class="block text-xs text-gray-400 mb-1">Max. počet hlasů na hráče</label>
          <input type="number" id="poll-max-votes" min="1" max="10" value="1" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-2">Možnosti (až 10)</label>
          <div id="poll-options-container" class="space-y-2"></div>
          <button type="button" onclick="addPollOptionInput()" class="mt-3 text-xs text-yellow-400 hover:underline flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Přidat možnost
          </button>
        </div>
        <div class="flex justify-end gap-3 pt-4 border-t border-gray-800">
          <button type="button" onclick="closePollModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded hover:bg-gray-700 text-sm">Zrušit</button>
          <button type="submit" class="px-4 py-2 gold-bg text-black font-bold rounded hover:opacity-90 text-sm">Uložit anketu</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: HISTORIE HER -->
  <div id="game-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-gray-900 border border-yellow-600/40 p-6 rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="game-modal-title" class="text-xl font-bold text-yellow-400 magic-font">Zapsat novou hru</h3>
        <button onclick="closeGameModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="add-game-form" onsubmit="saveGame(event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Název hry / scénáře</label>
            <input type="text" id="game-title-input" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white" required>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Vítězná strana</label>
            <select id="game-winner-input" class="w-full bg-black border border-gray-700 rounded p-2.5 text-sm text-white">
              <option value="GOOD">Dobro (Měšťané)</option>
              <option value="EVIL">Zlo (Démon)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Nahrát JSON scénář (volitelné)</label>
            <input type="file" accept=".json" onchange="handleGameScriptUpload(event)" class="w-full text-xs text-gray-400 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-yellow-500 file:text-black hover:file:bg-yellow-400 cursor-pointer">
          </div>
        </div>

        <div class="pt-2">
          <div class="flex justify-between items-center mb-2">
            <label class="text-sm font-semibold text-yellow-400">Hráči v této hře (až 20)</label>
            <button type="button" onclick="addGamePlayerRow()" class="text-xs bg-gray-800 hover:bg-gray-700 text-yellow-400 px-3 py-1.5 rounded flex items-center gap-1">
              <i class="fa-solid fa-user-plus"></i> Přidat studenta
            </button>
          </div>
          <div id="modal-game-players-container" class="max-h-60 overflow-y-auto pr-1"></div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-800">
          <button type="button" onclick="closeGameModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded hover:bg-gray-700 text-sm">Zrušit</button>
          <button type="submit" class="px-4 py-2 gold-bg text-black font-bold rounded hover:opacity-90 text-sm">Uložit hru</button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
